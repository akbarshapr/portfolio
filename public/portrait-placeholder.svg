<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 400" width="320" height="400" role="img" aria-label="Portrait placeholder">
  <title>Portrait placeholder</title>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0v20" fill="none" stroke="#a49a8b" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="320" height="400" fill="#bdb4a5"/>
  <rect width="320" height="400" fill="url(#grid)"/>

  <!-- Head and shoulders, kept flat and obviously diagrammatic. -->
  <g fill="#8d8474">
    <circle cx="160" cy="168" r="52"/>
    <path d="M62 330a98 98 0 0 1 196 0z"/>
  </g>

  <!-- Corner ticks, so the frame reads as a placeholder crop. -->
  <g stroke="#6f6759" stroke-width="2" fill="none" opacity="0.7">
    <path d="M24 44V24h20M276 24h20v20M296 356v20h-20M44 376H24v-20"/>
  </g>

  <text x="160" y="372" text-anchor="middle" fill="#5f584c"
        font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" letter-spacing="3.4">
    PLACEHOLDER
  </text>
</svg>
